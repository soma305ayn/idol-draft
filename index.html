<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ドラフト会議シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;
  --panel:#121b2e;
  --panel-2:#182240;
  --panel-3:#1d2a4a;
  --field:#2f6f4e;
  --field-light:#3e8963;
  --gold:#e3b341;
  --gold-soft:#f0cd6e;
  --text:#f3f5f0;
  --muted:#8c97ab;
  --danger:#d9534f;
  --border:rgba(255,255,255,0.09);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 50% -10%, #16233d 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.disp{font-family:'Oswald','Noto Sans JP',sans-serif; letter-spacing:0.02em;}
#app{max-width:560px;margin:0 auto;padding:0 0 84px;min-height:100vh;}
.hero{
  padding:28px 20px 22px;
  background:
    linear-gradient(180deg, rgba(47,111,78,0.35), transparent 70%),
    var(--panel);
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute; right:-40px; top:-40px; width:160px; height:160px;
  background:radial-gradient(circle, rgba(227,179,65,0.18), transparent 70%);
}
.eyebrow{
  font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.22em;
  color:var(--field-light); text-transform:uppercase; font-weight:600;
}
.h1{font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; margin:6px 0 2px; line-height:1.25;}
.sub{color:var(--muted); font-size:13.5px; line-height:1.6;}
.wrap{padding:18px 18px 8px;}
.card{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}
.card h2{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; margin:0 0 12px; color:var(--gold-soft); letter-spacing:0.03em;}
label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 5px;}
input[type=text],input[type=number]{
  width:100%; background:var(--panel-3); border:1px solid var(--border); border-radius:9px;
  padding:11px 12px; color:var(--text); font-size:15px; font-family:inherit;
}
input:focus{outline:none; border-color:var(--field-light);}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
button{
  font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:14.5px;
  border:none; border-radius:10px; padding:12px 16px; cursor:pointer;
  transition:transform .08s ease, opacity .15s ease;
}
button:active{transform:scale(0.97);}
button:disabled{opacity:0.4; cursor:not-allowed;}
.btn-primary{background:var(--field); color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--field-light);}
.btn-gold{background:var(--gold); color:#26200a;}
.btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-danger{background:transparent; border:1px solid var(--danger); color:#ff8b87;}
.btn-block{width:100%; margin-top:10px;}
.btn-sm{padding:8px 12px; font-size:12.5px; border-radius:8px;}
.team-chip{
  display:flex; align-items:center; gap:8px;
  padding:11px 13px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel-3); margin-bottom:8px; cursor:pointer;
}
.team-chip.mine{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
.team-chip.taken{opacity:0.55; cursor:default;}
.dot{width:10px;height:10px;border-radius:50%; flex:none;}
.team-chip .name{font-weight:700; font-size:14.5px;}
.team-chip .meta{margin-left:auto; font-size:11.5px; color:var(--muted);}
.status-bar{
  position:sticky; top:0; z-index:5;
  background:rgba(11,18,32,0.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:12px 18px;
  display:flex; align-items:center; justify-content:space-between;
}
.status-bar .r{font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:var(--gold-soft);}
.status-bar .p{font-size:12px; color:var(--muted); margin-top:1px;}
.badge{font-size:11px; padding:4px 9px; border-radius:100px; font-weight:700; letter-spacing:.02em;}
.badge.wait{background:rgba(140,151,171,0.18); color:var(--muted);}
.badge.turn{background:rgba(227,179,65,0.18); color:var(--gold-soft);}
.badge.go{background:rgba(62,137,99,0.22); color:var(--field-light);}
.player-list{max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:10px; margin-top:8px;}
.player-group{border-bottom:1px solid var(--border);}
.player-group:last-child{border-bottom:none;}
.group-header{
  position:sticky; top:0; z-index:1; cursor:pointer; list-style:none;
  display:flex; align-items:center; gap:6px;
  font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.05em;
  color:var(--gold-soft); background:var(--panel-3);
  padding:10px 12px; border-bottom:1px solid var(--border);
}
.group-header::-webkit-details-marker{display:none;}
.group-header::before{content:"▸"; font-size:11px; transition:transform .15s ease; color:var(--field-light);}
.player-group[open]>.group-header::before{transform:rotate(90deg);}
.group-count{color:var(--muted); font-weight:400; letter-spacing:0;}
.player-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.player-item:last-child{border-bottom:none;}
.player-item .pname{font-weight:700; font-size:14px;}
.player-item .ppos{font-size:11px; color:var(--muted);}
.player-item.selected{background:rgba(227,179,65,0.14); box-shadow:inset 3px 0 0 var(--gold);}
.player-item.taken{opacity:0.35; cursor:default;}
.picked-tag{margin-left:auto; font-size:10.5px; color:var(--muted);}
.submit-bar{margin-top:12px; display:flex; align-items:center; gap:10px;}
.submit-bar .sel-name{flex:1; font-size:13.5px; color:var(--muted);}
.turn-order{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px;}
.turn-pill{
  font-size:11.5px; padding:5px 10px; border-radius:100px; border:1px solid var(--border); color:var(--muted);
}
.turn-pill.active{background:var(--field); border-color:var(--field); color:#fff; font-weight:700;}
.turn-pill.done{opacity:0.4; text-decoration:line-through;}
.summary-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
.summary-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px; border-radius:10px; background:var(--panel-3); border:1px solid var(--border);
}
.summary-row .s-team{font-weight:700; font-size:14px; color:var(--text);}
.summary-row .s-player{font-size:14.5px; font-weight:700; color:var(--gold-soft); text-align:right;}
.summary-row .s-lottery{font-size:11px; color:var(--muted); margin-left:4px;}
.lottery-stage{
  text-align:center; padding:26px 16px; border-radius:14px;
  background:radial-gradient(circle at 50% 20%, rgba(227,179,65,0.16), transparent 65%), var(--panel-2);
  border:1px solid var(--border);
}
.lottery-stage .lot-label{font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.2em; color:var(--gold-soft); text-transform:uppercase;}
.lottery-stage .lot-player{font-size:22px; font-weight:900; margin:8px 0 14px;}
.lottery-slot{
  font-family:'Oswald',sans-serif; font-size:28px; font-weight:700;
  padding:18px 10px; border-radius:12px; background:var(--panel-3);
  border:2px solid var(--border); margin:10px 0 16px; min-height:38px;
}
.lottery-slot.winner{border-color:var(--gold); color:var(--gold-soft); box-shadow:0 0 22px rgba(227,179,65,0.35); animation:winner-pop .4s ease;}
@keyframes winner-pop{0%{transform:scale(0.92);} 60%{transform:scale(1.04);} 100%{transform:scale(1);}}
.contenders{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:14px;}
.lot-result{font-size:15px; line-height:1.7; margin-top:4px;}
.lot-winner-team{font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; color:var(--gold-soft);}
.lot-winner-player{font-size:19px; font-weight:900; color:var(--text);}
.board-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.board-table th,.board-table td{border:1px solid var(--border); padding:7px 8px; text-align:left; white-space:nowrap;}
.board-table th{background:var(--panel-3); font-family:'Oswald',sans-serif; font-weight:600; color:var(--gold-soft); position:sticky; top:0;}
.board-scroll{overflow:auto; max-height:340px; border-radius:10px; border:1px solid var(--border);}
.empty-cell{color:var(--muted);}
.toggle-link{color:var(--field-light); font-size:13px; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
.note{font-size:12px; color:var(--muted); line-height:1.6; margin-top:6px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.add-section{padding:12px 16px;}
.add-section summary{
  cursor:pointer; font-size:13px; color:var(--muted); font-weight:700;
  list-style:none;
}
.add-section summary::-webkit-details-marker{display:none;}
.add-section summary::before{content:"＋ "; color:var(--field-light);}
.add-section[open] summary::before{content:"－ ";}
.foot-reset{text-align:center; margin-top:24px;}
.foot-reset .foot-link{color:var(--muted); font-size:12px; padding:9px 16px; border-radius:9px;}
.escape-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  text-align:center; padding:9px 12px;
  background:rgba(11,18,32,0.72); backdrop-filter:blur(6px);
  border-top:1px solid rgba(255,255,255,0.06);
}
.escape-bar button{
  background:none; border:none; font-family:inherit; font-weight:400;
  color:rgba(243,245,240,0.32); font-size:11px; padding:4px 6px; cursor:pointer;
}
.escape-bar button:active{color:rgba(243,245,240,0.7);}
.escape-bar .escape-sep{color:rgba(243,245,240,0.18); font-size:11px;}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--panel-3); border:1px solid var(--border); color:var(--text);
  padding:12px 18px; border-radius:10px; font-size:13.5px; max-width:88%;
  box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:100; text-align:center;
  opacity:0; transition:opacity .2s ease;
}
.toast.show{opacity:1;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,9,18,0.72);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-box{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px;
  padding:20px; max-width:360px; width:100%;
}
.modal-box p{font-size:14.5px; line-height:1.6; margin:0 0 16px;}
.modal-box .row button{flex:1;}
</style>
</head>

  ['池田瑛紗','乃木坂46'],['一ノ瀬美空','乃木坂46'],['井上和','乃木坂46'],['岡本姫奈','乃木坂46'],

  ['小津玲奈','乃木坂46'],['海邉朱莉','乃木坂46'],['川端晃菜','乃木坂46'],['鈴木佑捺','乃木坂46'],
  ['瀬戸口心月','乃木坂46'],['長嶋凛桜','乃木坂46'],['増田三莉音','乃木坂46'],['森平麗心','乃木坂46'],
  ['矢田萌華','乃木坂46']
];
let roomCode=null, state=null, myId=null, lastStateStr=null;
let selectedPlayerId=null, showBoard=false, boardTaken=true;
const app=document.getElementById('app');
const uid=(p)=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ▼▼ 主催者が作成したFirebase Realtime DatabaseのURLに書き換え済み ▼▼ */
const FIREBASE_URL='https://idol-draft-default-rtdb.asia-southeast1.firebasedatabase.app';
/* ▲▲ ここまで ▲▲ */

function sanitizeRoomCode(s){
  return String(s||'').trim().replace(/[\s\/\\'"]/g,'').slice(0,24);
}
function roomUrl(){ return `${FIREBASE_URL}/rooms/${encodeURIComponent(roomCode)}.json`; }
function identityKey(){ return `idol_draft_identity:${roomCode}`; }
function lockUrl(){ return `${FIREBASE_URL}/locks/${encodeURIComponent(roomCode)}.json`; }
const LOCK_TIMEOUT_MS=15000;

/* 排他ロック取得: if-none-match:'*' はレスポンスヘッダーの読み取りに依存せず、
   ステータスコード(412=既にロックあり)だけで判定できるため確実に動作する */
async function tryAcquireLock(token){
  try{
    const res=await fetch(lockUrl(), {
      method:'PUT',
      headers:{'Content-Type':'application/json','if-none-match':'*'},
      body:JSON.stringify({token, ts:Date.now()})
    });
    if(res.ok) return true;
    if(res.status===412){
      // 既存ロックが古すぎる(操作中に落ちた等)場合は期限切れとみなして奪取
      try{
        const cur=await fetch(lockUrl());
        const text=await cur.text();
        const data=(text && text!=='null') ? JSON.parse(text) : null;
        if(!data || (Date.now()-data.ts) > LOCK_TIMEOUT_MS){
          const force=await fetch(lockUrl(), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token, ts:Date.now()})});
          return force.ok;
        }
      }catch(e){}
      return false;
    }
    return false;
  }catch(e){ return false; }
}
async function releaseLock(){
  try{ await fetch(lockUrl(), {method:'DELETE'}); }catch(e){}
}
/* 状態を書き換える操作は必ずこれで包み、同時操作による上書き事故を防ぐ */
async function withRoomLock(fn){
  const token=uid('lock');
  let acquired=false, attempts=0;
  for(let attempt=0; attempt<3 && !acquired; attempt++){
    attempts=attempt+1;
    acquired=await tryAcquireLock(token);
    if(!acquired) await new Promise(r=>setTimeout(r, 300+Math.random()*300));
  }
  dbg.lastLock={ok:acquired, at:nowStr(), attempts};
  if(!acquired){
    showToast('他の操作と混み合っています。少し待ってからもう一度お試しください。');
    await refreshState(); render();
    return false;
  }
  try{
    await fn();
    return true;
  } finally {
    await releaseLock();
  }
}


const dbg={
  lastGet:{ok:null, at:null, len:null, err:null},
  lastSet:{ok:null, at:null, len:null, err:null},
  lastPoll:{ok:null, at:null, changed:null, err:null},
  lastLock:{ok:null, at:null, attempts:0},
  pollCount:0
};
function nowStr(){ return new Date().toLocaleTimeString('ja-JP'); }

let toastTimer=null;
function showToast(msg){
  let el=document.getElementById('__toast');
  if(!el){ el=document.createElement('div'); el.id='__toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.classList.remove('show'); }, 2600);
}
function showConfirm(msg, okLabel, cancelLabel){
  return new Promise((resolve)=>{
    const overlay=document.createElement('div');
    overlay.className='modal-overlay';
    overlay.innerHTML=`<div class="modal-box">
      <p>${esc(msg)}</p>
      <div class="row">
        <button class="btn-ghost" id="__mc-cancel">${esc(cancelLabel||'キャンセル')}</button>
        <button class="btn-danger" id="__mc-ok" style="border:1px solid var(--danger);">${esc(okLabel||'実行')}</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const cleanup=(result)=>{ overlay.remove(); resolve(result); };
    overlay.querySelector('#__mc-ok').addEventListener('click', ()=>cleanup(true));
    overlay.querySelector('#__mc-cancel').addEventListener('click', ()=>cleanup(false));
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) cleanup(false); });
  });
}

function loadIdentity(){
  if(!roomCode) return null;
  try{ const raw=localStorage.getItem(identityKey()); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveIdentityLocal(){
  if(!roomCode) return;
  try{ localStorage.setItem(identityKey(), JSON.stringify(myId)); }catch(e){}
}
function clearIdentityLocal(){
  if(!roomCode) return;
  try{ localStorage.removeItem(identityKey()); }catch(e){}
}
function loadLastRoom(){
  try{ return localStorage.getItem('idol_draft_last_room')||''; }catch(e){ return ''; }
}
function saveLastRoom(code){
  try{ localStorage.setItem('idol_draft_last_room', code); }catch(e){}
}

function normalizeState(s){
  if(!s) return s;
  s.teams = s.teams || [];
  s.players = s.players || [];
  s.log = s.log || [];
  s.waiverOrder = s.waiverOrder || [];
  s.currentRoundOrder = s.currentRoundOrder || [];
  s.round1 = s.round1 || {};
  s.round1.submissions = s.round1.submissions || {};
  s.round1.pendingTeamIds = s.round1.pendingTeamIds || [];
  s.round1.lotteryQueue = s.round1.lotteryQueue || [];
  if(s.round1.currentLottery===undefined) s.round1.currentLottery = null;
  if(s.roundSummary===undefined) s.roundSummary = null;
  if(s.roundSummary) s.roundSummary.acked = s.roundSummary.acked || {};
  if(s.pendingAfterSummary===undefined) s.pendingAfterSummary = null;
  if(Array.isArray(s.teams)){
    s.teams.forEach(t=>{
      if(t.claimedBy===undefined) t.claimedBy=null;
      if(t.retiredFromRound===undefined) t.retiredFromRound=null;
    });
  }
  if(Array.isArray(s.players)){
    s.players.forEach(p=>{
      if(p.ownerTeamId===undefined) p.ownerTeamId=null;
      if(p.round===undefined) p.round=null;
      if(!p.pos) p.pos='';
    });
  }
  return s;
}
let currentEtag=null;
async function refreshState(){
  if(!roomCode){ state=null; currentEtag=null; return; }
  try{
    const res=await fetch(roomUrl(), {headers:{'Accept':'application/json','X-Firebase-ETag':'true'}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    state = (text && text!=='null') ? normalizeState(JSON.parse(text)) : null;
    lastStateStr = text;
    currentEtag = res.headers.get('ETag');
    dbg.lastGet={ok:true, at:nowStr(), len:text?text.length:0, err:null};
  }catch(e){
    state=null;
    dbg.lastGet={ok:false, at:nowStr(), len:null, err:(e&&e.message)||String(e)};
  }
}
/* 保存前に読み込んだ時点(currentEtag)から他の端末が書き換えていた場合は
   409/412で拒否されるようにし、競合時は保存せず最新状態を取り直す。
   戻り値: 保存できたら true、競合・失敗で保存できなかったら false */
async function saveState(){
  try{
    const body=JSON.stringify(state);
    const headers={'Content-Type':'application/json','X-Firebase-ETag':'true'};
    if(currentEtag) headers['if-match']=currentEtag;
    const res=await fetch(roomUrl(), {method:'PUT', headers, body});
    if(res.status===412){
      dbg.lastSet={ok:false, at:nowStr(), len:null, err:'競合(412): 他の端末が先に更新しました'};
      showToast('他の操作と競合したため保存を中断し、最新の状態を取得しました。もう一度お試しください。');
      await refreshState();
      render();
      return false;
    }
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    lastStateStr=body;
    const newEtag=res.headers.get('ETag');
    if(newEtag) currentEtag=newEtag;
    dbg.lastSet={ok:true, at:nowStr(), len:body.length, err:null};
    return true;
  }catch(e){
    dbg.lastSet={ok:false, at:nowStr(), len:null, err:(e&&e.message)||String(e)};
    showToast('保存に失敗しました。通信状況を確認してもう一度お試しください。');
    return false;
  }
}
async function pollLoop(){
  if(!roomCode) return;
  dbg.pollCount++;
  try{
    const res=await fetch(roomUrl(), {headers:{'Accept':'application/json','X-Firebase-ETag':'true'}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    const changed=(text!==lastStateStr);
    dbg.lastPoll={ok:true, at:nowStr(), changed, err:null};
    if(changed){
      lastStateStr=text;
      currentEtag=res.headers.get('ETag');
      state=(text && text!=='null')?normalizeState(JSON.parse(text)):null;
      render();
    } else {
      currentEtag=res.headers.get('ETag')||currentEtag;
      updateDebugPanelInPlace();
    }
  }catch(e){
    dbg.lastPoll={ok:false, at:nowStr(), changed:null, err:(e&&e.message)||String(e)};
    updateDebugPanelInPlace();
  }
}

function assignPick(teamId, playerId, round, method){
  const player=state.players.find(p=>p.id===playerId);
  player.status='taken'; player.ownerTeamId=teamId; player.round=round;
  state.log.push({round, teamId, playerId, method, ts:Date.now()});
}
function teamById(id){ return state.teams.find(t=>t.id===id); }
function playerById(id){ return state.players.find(p=>p.id===id); }

/* ---------- actions ---------- */
async function createRoom(teamCount, totalRounds){
  const teams=[];
  for(let i=1;i<=teamCount;i++){
    teams.push({id:uid('team'), name:`${i}球団目`, claimedBy:null, color:TEAM_COLORS[(i-1)%TEAM_COLORS.length]});
  }
  const players=PRESET_PLAYERS.map(([name,pos])=>({id:uid('p'), name, pos, status:'available', ownerTeamId:null, round:null}));
  state={
    version:1, createdAt:Date.now(), settings:{teamCount, totalRounds},
    teams, players, phase:'setup', round:1,
    round1:{submissions:{}, pendingTeamIds:teams.map(t=>t.id), lotteryQueue:[], currentLottery:null},
    waiverOrder:[], turnIndex:0, log:[]
  };
  currentEtag=null;
  await saveState();
  render();
}
function stateLostGuard(){
  if(!state){ showToast('通信状況によりデータを取得できませんでした。もう一度お試しください。'); render(); return true; }
  return false;
}
async function claimTeam(teamId, nickname, teamName){
  if(!nickname.trim()) return showToast('ニックネームを入力してください');
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    const team=teamById(teamId);
    if(!team) return showToast('チームが見つかりません。画面を更新してください。');
    if(team.claimedBy && team.claimedBy!==nickname.trim()) return showToast('このチームはすでに他の人が担当しています');
    team.claimedBy=nickname.trim();
    if(teamName && teamName.trim()) team.name=teamName.trim();
    myId={nickname:nickname.trim(), teamId};
    saveIdentityLocal();
    await saveState(); render();
  });
}
async function releaseTeam(){
  if(!myId) return;
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    const team=teamById(myId.teamId);
    if(team && team.claimedBy===myId.nickname) team.claimedBy=null;
    myId=null; clearIdentityLocal();
    await saveState(); render();
  });
}
async function startDraft(){
  await refreshState();
  if(stateLostGuard()) return;
  if(state.phase!=='setup'){ showToast('すでに他の人がドラフトを開始しています。画面を更新します。'); render(); return; }
  const unclaimed=state.teams.filter(t=>!t.claimedBy);
  if(unclaimed.length>0 && !(await showConfirm(`${unclaimed.length}球団が未確定です。空席のまま始めますか？`, '始める'))) return;
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='setup'){ showToast('すでに他の人がドラフトを開始しています。画面を更新します。'); render(); return; }
    const claimed=state.teams.filter(t=>t.claimedBy);
    if(claimed.length<2) return showToast('参加チームが2球団以上必要です');
    if(state.players.length<claimed.length) return showToast('選手プールが不足しています。参加球団数以上の選手を登録してください。');
    state.phase='round1_submit'; state.round=1;
    state.round1.pendingTeamIds=claimed.map(t=>t.id);
    state.round1.submissions={}; state.round1.lotteryQueue=[]; state.round1.currentLottery=null;
    await saveState(); render();
  });
}
async function submitRound1(){
  if(!selectedPlayerId) return showToast('選手を選択してください');
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='round1_submit'){ showToast('状況が変わりました。画面を更新します。'); render(); return; }
    if(!myId||!state.round1.pendingTeamIds.includes(myId.teamId)){ showToast('現在、あなたの球団は1巡目の指名対象ではありません。'); render(); return; }
    if(state.round1.submissions[myId.teamId]) { showToast('すでに提出済みです'); render(); return; }
    const p=playerById(selectedPlayerId);
    if(!p||p.status!=='available'){ showToast('その選手は選択できません'); selectedPlayerId=null; render(); return; }
    state.round1.submissions[myId.teamId]=selectedPlayerId;
    selectedPlayerId=null;
    await saveState(); render();
  });
}
async function revealRound1(){
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='round1_submit'){ showToast('状況が変わりました。画面を更新します。'); render(); return; }
    const pend=state.round1.pendingTeamIds, subs=state.round1.submissions;
    if(pend.some(t=>!subs[t])){ showToast('まだ全球団の提出が揃っていません'); render(); return; }
    const groups={};
    pend.forEach(tid=>{ const pid=subs[tid]; (groups[pid]=groups[pid]||[]).push(tid); });
    const queue=[];
    Object.entries(groups).forEach(([pid,tids])=>{
      if(tids.length===1) assignPick(tids[0], pid, 1, 'normal');
      else queue.push({playerId:pid, contendingTeamIds:tids, winnerTeamId:null});
    });
    const stillPending=[];
    queue.forEach(q=>q.contendingTeamIds.forEach(t=>{ if(!stillPending.includes(t)) stillPending.push(t); }));
    state.round1.pendingTeamIds=stillPending;
    state.round1.submissions={};
    if(queue.length>0){ state.round1.lotteryQueue=queue; state.round1.currentLottery=queue[0]; state.phase='lottery'; }
    else if(stillPending.length===0){ finishRound1(); }
    await saveState(); render();
  });
}
function finishRound1(){
  // 基準順(ウェーバー順)は球団番号順(1球団目→順に)。2巡目=基準順、3巡目=逆順、4巡目=基準順…と交互に使う
  const claimed=state.teams.filter(t=>t.claimedBy).map(t=>t.id);
  state.waiverOrder=claimed;
  state.roundSummary={round:1, acked:{}};
  state.pendingAfterSummary = state.settings.totalRounds>=2
    ? {phase:'snake_pick', round:2, turnIndex:0}
    : {phase:'finished'};
  state.phase='round_summary';
}
let lotteryDrawing=false;
async function drawLottery(){
  if(lotteryDrawing) return;
  try{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='lottery'||!state.round1.currentLottery) { render(); return; }
    lotteryDrawing=true;
    const {contendingTeamIds}=state.round1.currentLottery;
    const slot=document.getElementById('lot-slot');
    const drawBtn=document.getElementById('lot-draw-btn');
    if(drawBtn) drawBtn.disabled=true;
    // 減速しながら長めに回転させる演出(合計 約3.6秒)
    const intervals=[80,80,80,80,80,80,90,90,100,110,120,140,160,190,230,280,340,420,520,650];
    let step=0;
    function tick(){
      if(!slot) return;
      const t=teamById(contendingTeamIds[Math.floor(Math.random()*contendingTeamIds.length)]);
      slot.textContent=t?teamDisplayName(t):'???';
      step++;
      if(step<intervals.length){
        setTimeout(tick, intervals[step]);
      } else {
        finalizeLottery();
      }
    }
    tick();
  }catch(e){ lotteryDrawing=false; showToast('エラーが発生しました。もう一度お試しください。'); }
}
async function finalizeLottery(){
  let winnerId=null, cur=null, decided=false;
  try{
    await withRoomLock(async ()=>{
      await refreshState();
      if(stateLostGuard()){ return; }
      if(state.phase!=='lottery' || !state.round1.currentLottery){
        render(); return;
      }
      cur=state.round1.currentLottery;
      winnerId=cur.contendingTeamIds[Math.floor(Math.random()*cur.contendingTeamIds.length)];
      assignPick(winnerId, cur.playerId, 1, 'lottery');
      cur.winnerTeamId=winnerId;
      state.round1.pendingTeamIds=state.round1.pendingTeamIds.filter(t=>t!==winnerId);
      const saved=await saveState();
      if(saved) decided=true;
    });
  }catch(e){ showToast('エラーが発生しました。もう一度お試しください。'); }
  lotteryDrawing=false;
  if(!decided){ render(); return; }
  const slot=document.getElementById('lot-slot');
  if(slot){ slot.textContent=teamDisplayName(teamById(winnerId)); slot.classList.add('winner'); }
  render();
  const playerIdForCheck=cur.playerId;
  setTimeout(async ()=>{
    try{
      await withRoomLock(async ()=>{
        await refreshState();
        if(stateLostGuard()) return;
        if(state.phase!=='lottery' || !state.round1.currentLottery || state.round1.currentLottery.playerId!==playerIdForCheck){
          render(); return; // 既に他の端末が次に進めている
        }
        state.round1.lotteryQueue.shift();
        if(state.round1.lotteryQueue.length>0){ state.round1.currentLottery=state.round1.lotteryQueue[0]; state.phase='lottery'; }
        else if(state.round1.pendingTeamIds.length>0){ state.phase='round1_submit'; state.round1.currentLottery=null; }
        else { finishRound1(); }
        await saveState(); render();
      });
    }catch(e){ showToast('エラーが発生しました。画面を更新してください。'); }
  }, 4500);
}
async function submitSnakePick(){
  if(!selectedPlayerId) return showToast('選手を選択してください');
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='snake_pick') { showToast('状況が変わりました。画面を更新します。'); render(); return; }
    const order=state.currentRoundOrder;
    const curTeam=order[state.turnIndex];
    if(!myId||myId.teamId!==curTeam){ showToast('あなたの番ではありません'); render(); return; }
    const p=playerById(selectedPlayerId);
    if(!p||p.status!=='available'){ showToast('その選手は選択できません'); selectedPlayerId=null; render(); return; }
    assignPick(curTeam, selectedPlayerId, state.round, 'normal');
    selectedPlayerId=null;
    state.turnIndex++;
    if(state.turnIndex>=order.length){
      const completedRound=state.round;
      const nextRound=completedRound+1;
      state.roundSummary={round:completedRound, acked:{}};
      state.pendingAfterSummary = nextRound>state.settings.totalRounds
        ? {phase:'finished'}
        : {phase:'snake_pick', round:nextRound};
      state.phase='round_summary';
    }
    await saveState(); render();
  });
}
async function retireTeam(){
  if(!myId) return;
  const myTeamNow=teamById(myId.teamId);
  if(myTeamNow && myTeamNow.retiredFromRound!=null) return showToast('すでに指名終了を選択しています');
  if(!(await showConfirm('今後の指名をすべて終了しますか？次の巡以降、あなたの球団の指名はスキップされます（この操作は取り消せません）。', '指名を終了する'))) return;
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    const t=teamById(myId.teamId);
    if(!t) return;
    if(t.retiredFromRound!=null){ showToast('すでに指名終了を選択しています'); render(); return; }
    let effectiveRound;
    if(state.phase==='round_summary' && state.pendingAfterSummary && state.pendingAfterSummary.phase==='snake_pick'){
      effectiveRound = state.pendingAfterSummary.round;
    } else {
      effectiveRound = (state.round||1) + 1;
    }
    t.retiredFromRound = effectiveRound;
    await saveState(); render();
  });
}
async function ackRoundSummary(){
  if(!myId) return;
  await withRoomLock(async ()=>{
    await refreshState();
    if(stateLostGuard()) return;
    if(state.phase!=='round_summary'){ render(); return; }
    if(!state.roundSummary) { render(); return; }
    state.roundSummary.acked = state.roundSummary.acked || {};
    if(state.roundSummary.acked[myId.teamId]){ render(); return; }
    state.roundSummary.acked[myId.teamId]=true;
    const claimedIds = state.teams.filter(t=>t.claimedBy).map(t=>t.id);
    const allAcked = claimedIds.length>0 && claimedIds.every(tid=>state.roundSummary.acked[tid]);
    if(allAcked){
      const pending = state.pendingAfterSummary || {phase:'finished'};
      if(pending.phase==='snake_pick'){
        const next=resolveNextActiveRound(pending.round);
        if(next){
          state.phase='snake_pick';
          state.round=next.round;
          state.turnIndex=0;
          state.currentRoundOrder=next.order;
        } else {
          state.phase='finished';
        }
      } else {
        state.phase='finished';
      }
      state.roundSummary = null;
      state.pendingAfterSummary = null;
    }
    await saveState(); render();
  });
}
async function resetRoom(){
  if(!(await showConfirm('このドラフト全体をリセットします。よろしいですか？', 'リセットする'))) return;

/* ---------- rendering helpers ---------- */
function myTeam(){ return myId ? teamById(myId.teamId) : null; }
function amClaimedHere(){ if(!myId||!state) return false; const t=teamById(myId.teamId); return !!(t && t.claimedBy===myId.nickname); }

function groupByAffiliation(players){
  const groups={};
  const order=[];
  players.forEach(p=>{
    const key=p.pos && p.pos.trim() ? p.pos.trim() : 'その他';
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(p);
  });
  order.sort((a,b)=> a==='その他' ? 1 : b==='その他' ? -1 : a.localeCompare(b,'ja'));
  return order.map(k=>({affiliation:k, players:groups[k]}));
}
let openGroups={};
function groupKey(prefix, affiliation){ return `${prefix}::${affiliation}`; }
function playerListHTML(idPrefix, selectable){
  const available=state.players.filter(p=>p.status==='available');
  const taken=state.players.filter(p=>p.status==='taken');
  let html=`<div class="player-list" id="${idPrefix}-list">`;
  groupByAffiliation(available).forEach(g=>{
    const key=groupKey(idPrefix, g.affiliation);
    const hasSelected = g.players.some(p=>selectedPlayerId===p.id);
    const isOpen = openGroups[key]!==undefined ? openGroups[key] : hasSelected;
    html+=`<details class="player-group" data-gkey="${esc(key)}" ${isOpen?'open':''}>
      <summary class="group-header">${esc(g.affiliation)} <span class="group-count">(${g.players.length})</span></summary>`;
    g.players.forEach(p=>{
      html+=`<div class="player-item ${selectedPlayerId===p.id?'selected':''}" data-act="select-player" data-id="${p.id}">
        <div><div class="pname">${esc(p.name)}</div>${p.pos?`<div class="ppos">${esc(p.pos)}</div>`:''}</div>
      </div>`;
    });
    html+='</details>';
  });
  if(available.length===0) html+=`<div style="padding:14px;color:var(--muted);font-size:13px;">指名可能な選手がいません。</div>`;
  html+='</div>';
  if(taken.length>0){
    html+=`<div class="note">指名済み: ${taken.map(p=>esc(p.name)).join('、')}</div>`;
  }
  return html;
}
function bindGroupToggles(){
  document.querySelectorAll('.player-group[data-gkey]').forEach(el=>{
    el.addEventListener('toggle', ()=>{ openGroups[el.dataset.gkey]=el.open; });
  });
}
function truncateCanvasText(ctx, text, maxWidth){
  if(ctx.measureText(text).width<=maxWidth) return text;
  let t=text;
  while(t.length>1 && ctx.measureText(t+'…').width>maxWidth){ t=t.slice(0,-1); }
  return t+'…';
}
function downloadBoardImage(){
  try{
    const teams=state.teams.filter(t=>t.claimedBy || state.log.some(l=>l.teamId===t.id));
    const rounds=state.log.length ? Math.max(...state.log.map(l=>l.round)) : 0;
    if(teams.length===0 || rounds===0){ showToast('保存できる指名結果がありません'); return; }

    const leftW=56, cellW=150, cellH=44, headerH=54, titleH=64, pad=24, footH=34;
    const scale=2;
    const width=pad*2+leftW+cellW*teams.length;
    const height=pad*2+titleH+headerH+cellH*rounds+footH;

    const canvas=document.createElement('canvas');
    canvas.width=width*scale;
    canvas.height=height*scale;
    const ctx=canvas.getContext('2d');
    ctx.scale(scale,scale);
    ctx.textBaseline='middle';

    // 背景
    ctx.fillStyle='#0b1220';
    ctx.fillRect(0,0,width,height);

    // タイトル
    ctx.fillStyle='#f0cd6e';
    ctx.font='bold 24px "Oswald","Noto Sans JP",sans-serif';
    ctx.textAlign='left';
    ctx.fillText('ドラフト会議 結果', pad, pad+titleH/2-6);
    ctx.fillStyle='#8c97ab';
    ctx.font='12px "Noto Sans JP",sans-serif';
    ctx.fillText(`部屋番号: ${roomCode}　全${state.settings.totalRounds}巡`, pad, pad+titleH/2+18);

    const gridX=pad+leftW, gridY=pad+titleH;

    // ヘッダー行(球団名)
    teams.forEach((t,i)=>{
      const cx=gridX+i*cellW;
      ctx.fillStyle='#1d2a4a';
      ctx.fillRect(cx, gridY, cellW, headerH);
      ctx.fillStyle='#f0cd6e';
      ctx.font='bold 13px "Noto Sans JP",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(truncateCanvasText(ctx, teamDisplayName(t), cellW-16), cx+cellW/2, gridY+headerH/2);
    });
    ctx.fillStyle='#1d2a4a';
    ctx.fillRect(pad, gridY, leftW, headerH);
    ctx.fillStyle='#f0cd6e';
    ctx.font='bold 12px "Oswald",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('巡', pad+leftW/2, gridY+headerH/2);

    // 各巡の行
    for(let r=1;r<=rounds;r++){
      const ry=gridY+headerH+(r-1)*cellH;
      const rowBg = r%2===0 ? '#121b2e' : '#182240';
      ctx.fillStyle=rowBg;
      ctx.fillRect(pad, ry, leftW, cellH);
      ctx.fillStyle='#8c97ab';
      ctx.font='bold 13px "Oswald",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(String(r), pad+leftW/2, ry+cellH/2);

      teams.forEach((t,i)=>{
        const cx=gridX+i*cellW;
        ctx.fillStyle=rowBg;
        ctx.fillRect(cx, ry, cellW, cellH);
        const pick=state.log.find(l=>l.round===r && l.teamId===t.id);
        let text='—', color='#5a6478';
        if(pick){
          const p=playerById(pick.playerId);
          text=(p?p.name:'?')+(pick.method==='lottery'?' 🎯':'');
          color='#f3f5f0';
        } else if(t.retiredFromRound!=null && r>=t.retiredFromRound){
          text='指名終了'; color='#5a6478';
        }
        ctx.fillStyle=color;
        ctx.font='13px "Noto Sans JP",sans-serif';
        ctx.textAlign='center';
        ctx.fillText(truncateCanvasText(ctx, text, cellW-16), cx+cellW/2, ry+cellH/2);
      });
    }

    // グリッド線
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=1;
    for(let i=0;i<=teams.length;i++){
      const gx=gridX+i*cellW;
      ctx.beginPath(); ctx.moveTo(gx, gridY); ctx.lineTo(gx, gridY+headerH+cellH*rounds); ctx.stroke();
    }
    for(let r=0;r<=rounds;r++){
      const gy=gridY+headerH+r*cellH;
      ctx.beginPath(); ctx.moveTo(pad, gy); ctx.lineTo(gridX+cellW*teams.length, gy); ctx.stroke();
    }
    ctx.strokeRect(pad, gridY, leftW+cellW*teams.length, headerH+cellH*rounds);

    // フッター
    ctx.fillStyle='#5a6478';
    ctx.font='11px "Noto Sans JP",sans-serif';
    ctx.textAlign='left';
    ctx.fillText('Idol Draft Conference Simulator', pad, height-pad-footH/2+10);

    const url=canvas.toDataURL('image/png');
    showBoardImageModal(url);
  }catch(e){
    showToast('画像の生成に失敗しました。');
  }
}

function boardHTML(){
  const rounds=[...new Set(state.log.map(l=>l.round))].sort((a,b)=>a-b);
  const teams=state.teams.filter(t=>t.claimedBy || state.log.some(l=>l.teamId===t.id));
  if(state.log.length===0) return `<p class="note">まだ指名結果がありません。</p>`;
  let html=`<div class="board-scroll"><table class="board-table"><thead><tr><th>巡</th>`;
  teams.forEach(t=>html+=`<th>${esc(teamDisplayName(t))}</th>`);
  html+='</tr></thead><tbody>';
  const maxRound = Math.max(...rounds, state.round);
  for(let r=1;r<=maxRound;r++){
    html+=`<tr><td>${r}</td>`;
    teams.forEach(t=>{
      const pick=state.log.find(l=>l.round===r && l.teamId===t.id);
      if(pick){
        const p=playerById(pick.playerId);
        html+=`<td>${esc(p?p.name:'?')}${pick.method==='lottery'?' 🎯':''}</td>`;
      } else if(t.retiredFromRound!=null && r>=t.retiredFromRound){
        html+=`<td class="empty-cell">🏳️終了</td>`;
      } else html+=`<td class="empty-cell">—</td>`;
    });
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  return html;
}
function statusBarHTML(){

function teamDisplayName(t){
  if(!t) return '';
  return t.claimedBy || t.name;
}
/* 2巡目=ウェーバー順(基準順)、3巡目=逆ウェーバー順、4巡目=ウェーバー順…と巡ごとに交互に切り替える */
function orderForRound(round){
  const base=state.waiverOrder||[];
  return (round%2===0) ? base : [...base].reverse();
}
/* その巡の時点で「指名終了」していない球団だけを残した、実際に使う指名順を計算 */
function computeRoundOrder(round){
  return orderForRound(round).filter(tid=>{
    const t=teamById(tid);
    return !(t && t.retiredFromRound!=null && round>=t.retiredFromRound);
  });
}
/* round以降で、実際に指名者が1人以上いる最初の巡を探す。全員指名終了していたらnull(ドラフト終了) */
function resolveNextActiveRound(round){
  let r=round;
  while(r<=state.settings.totalRounds){
    const order=computeRoundOrder(r);
    if(order.length>0) return {round:r, order};
    r++;
  }
  return null;
}

function filterPlayers(listId, q){
  const list=document.getElementById(listId);
  if(!list) return;
  const query=q.trim().toLowerCase();
  const groups=Array.from(list.querySelectorAll('.player-group'));
  groups.forEach(group=>{
    let hasVisible=false;
    group.querySelectorAll('.player-item').forEach(el=>{
      const name=el.querySelector('.pname')?.textContent.toLowerCase()||'';
      const visible=name.includes(query);
      el.style.display = visible ? '' : 'none';
      if(visible) hasVisible=true;
    });
    group.style.display = hasVisible ? '' : 'none';
    if(query){
      if(hasVisible){ group.open=true; openGroups[group.dataset.gkey]=true; }
    }
  });
}

  const everSaved = s.ok===true;
  const getLine = g.ok===null ? '未実行'
    : g.ok ? `成功 (${g.at} / ${g.len}文字)`
    : everSaved
      ? `⚠️ 取得エラー (${g.at}) — ${esc(g.err||'')}`
      : `取得エラー (${g.at}) — この部屋番号がまだ誰にも作成されていない場合は正常な表示です`;
  return `<div class="wrap"><details class="card add-section" id="__dbg" ${dbgPanelOpen?'open':''}>
    <summary>接続診断情報（不具合報告用）</summary>
    <div style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.9;">
      保存先: Firebase Realtime Database<br>
      部屋番号: <b style="color:var(--text)">${esc(roomCode||'（未設定）')}</b><br>
      この端末でこの部屋を作成/保存したことがあるか: <b style="color:var(--text)">${everSaved?'はい':'いいえ'}</b><br>
      読み込み(get): ${getLine}<br>
      保存(set): ${s.ok===null?'未実行':(s.ok?`成功 (${s.at} / ${s.len}文字)`:`失敗 (${s.at}) — ${esc(s.err||'')}`)}<br>
      排他ロック取得: ${l.ok===null?'未実行':(l.ok?`成功 (${l.at} / 試行${l.attempts}回)`:`失敗 (${l.at} / 試行${l.attempts}回) — 混雑中`)}<br>
      自動更新ポーリング: ${p.ok===null?'未実行':(p.ok?`OK (${p.at} / 変化:${p.changed?'あり':'なし'})`:`失敗 (${p.at}) — ${esc(p.err||'')}`)}　実行回数:${dbg.pollCount}
    </div>
  </details></div>`;
}
function bindDebugToggle(){
  const el=document.getElementById('__dbg');
  if(el) el.addEventListener('toggle', ()=>{ dbgPanelOpen=el.open; });
}
function appendDebugPanel(){
  const old=document.getElementById('__dbg-wrap');
  if(old) old.remove();
  const div=document.createElement('div');
  div.id='__dbg-wrap';
  div.innerHTML=debugPanelHTML();
  app.appendChild(div);
  bindDebugToggle();
}
function updateDebugPanelInPlace(){
  const wrap=document.getElementById('__dbg-wrap');
  if(wrap){ wrap.innerHTML=debugPanelHTML(); bindDebugToggle(); }
}
function appendEscapeFooter(){
  const old=document.getElementById('__escape-footer');
  if(old) old.remove();
  if(!roomCode) return;
  const div=document.createElement('div');
  div.id='__escape-footer';
  div.className='escape-bar';
  div.innerHTML=`<button data-act="leave-room">自分だけ退出する</button><span class="escape-sep">|</span><button data-act="reset-room">この会議を終了する（全員のデータを削除）</button>`;
  app.appendChild(div);
}
function render(){
  if(!roomCode){ renderRoomGate(); }
  else if(!state){ renderCreateRoom(); }
  else if(!amClaimedHere()){ renderJoinScreen(); }
  else if(state.phase==='setup') renderSetupScreen();
  else if(state.phase==='round1_submit') renderRound1Submit();
  else if(state.phase==='lottery') renderLottery();
  else if(state.phase==='snake_pick') renderSnakePick();
  else if(state.phase==='round_summary') renderRoundSummary();
  else if(state.phase==='finished') renderFinished();
  bindGroupToggles();
  appendDebugPanel();
  appendEscapeFooter();
}

/* ---------- delegated events ---------- */
app.addEventListener('click', (e)=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  if(act==='enter-room'){
    const code=document.getElementById('in-roomcode').value;
    enterRoom(code);
  } else if(act==='leave-room'){ leaveRoom(); }
  else if(act==='create-room'){
    const tc=parseInt(document.getElementById('in-teamcount').value,10)||10;
    const rd=parseInt(document.getElementById('in-rounds').value,10)||5;
    createRoom(Math.max(2,Math.min(20,tc)), Math.max(1,Math.min(15,rd)));
  } else if(act==='claim-team'){
    const nick=document.getElementById('in-nick').value;
    claimTeam(id, nick);
  } else if(act==='release-team'){ showConfirm('担当を解除しますか？','解除する').then(ok=>{ if(ok) releaseTeam(); }); }
  else if(act==='start-draft'){ startDraft(); }
  else if(act==='select-player'){
    selectedPlayerId=id;
    document.querySelectorAll('.player-item').forEach(elm=>elm.classList.remove('selected'));
    el.classList.add('selected');
    document.querySelectorAll('.submit-bar .sel-name').forEach(s=>s.textContent='選択中: '+ (playerById(id)?.name||''));
    document.querySelectorAll('.submit-bar button').forEach(b=>b.disabled=false);
  } else if(act==='submit-r1'){ submitRound1(); }
  else if(act==='reveal-r1'){ revealRound1(); }
  else if(act==='draw-lottery'){ drawLottery(); }
  else if(act==='submit-sn'){ submitSnakePick(); }
  else if(act==='toggle-board'){ showBoard=!showBoard; render(); }
  else if(act==='reset-room'){ resetRoom(); }
  else if(act==='ack-round-summary'){ ackRoundSummary(); }
  else if(act==='retire-team'){ retireTeam(); }
  else if(act==='download-board'){ downloadBoardImage(); }
});

/* ---------- init ---------- */
(async function init(){
  const last=loadLastRoom();
  if(last){
    await enterRoom(last);
  } else {
    render();
  }
  setInterval(pollLoop, 2500);
})();
</script>
</body>
</html>
